name: Lint and deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Lint all PHP files
        run: find . -type f -name '*.php' -not -path './config/config.local.php' -print0 | xargs -0 -n1 php -l

  deploy:
    name: Deploy over FTP
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sync files to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR || './' }}
          local-dir: ./
          dangerous-clean-slate: false
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github/**/*
            **/.vscode/**
            **/config/config.local.php
            **/config/config.local.php.example
            **/*.md
            **/*.sql
            **/.gitignore
