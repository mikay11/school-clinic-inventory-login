name: Lint, build and deploy React + PHP API to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Lint all PHP files
        run: find . -type f -name '*.php' -not -path './api/config/config.local.php' -print0 | xargs -0 -n1 php -l

  deploy:
    name: Build React and deploy over FTP
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Create server configuration from secrets
        env:
          CFG_DB_HOST: ${{ secrets.DB_HOST }}
          CFG_DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          CFG_DB_NAME: ${{ secrets.DB_NAME }}
          CFG_DB_USER: ${{ secrets.DB_USER }}
          CFG_DB_PASS: ${{ secrets.DB_PASS }}
          CFG_APP_BASE_URL: ${{ secrets.APP_BASE_URL || '' }}
          CFG_API_ALLOWED_ORIGIN: ${{ secrets.API_ALLOWED_ORIGIN || '' }}
          CFG_APP_TIMEZONE: ${{ secrets.APP_TIMEZONE || 'Asia/Manila' }}
          CFG_MAIL_FROM: ${{ secrets.MAIL_FROM || 'no-reply@school.edu.ph' }}
          CFG_SESSION_IDLE_MINUTES: ${{ secrets.SESSION_IDLE_MINUTES || '30' }}
          CFG_APP_DEBUG: ${{ secrets.APP_DEBUG || 'false' }}
          CFG_SHOW_RESET_LINK: ${{ secrets.SHOW_RESET_LINK || 'false' }}
        run: |
          if [ -z "$CFG_DB_HOST" ] || [ -z "$CFG_DB_NAME" ] || [ -z "$CFG_DB_USER" ]; then
            echo "DB_HOST, DB_NAME and DB_USER secrets are required."
            exit 1
          fi
          php -r '
          $keys = ["DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASS", "APP_BASE_URL", "API_ALLOWED_ORIGIN", "APP_TIMEZONE", "MAIL_FROM", "SESSION_IDLE_MINUTES", "APP_DEBUG", "SHOW_RESET_LINK"];
          $out = "<?php\ndeclare(strict_types=1);\n\nreturn [\n";
          foreach ($keys as $key) {
              $value = getenv("CFG_" . $key);
              $out .= "    \"" . $key . "\" => " . var_export($value === false ? "" : $value, true) . ",\n";
          }
          $out .= "];\n";
          file_put_contents("api/config/config.local.php", $out);
          '

      - name: Deploy React build to web root
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR || './' }}
          local-dir: ./dist/
          dangerous-clean-slate: false
          timeout: 120000

      - name: Deploy PHP API to /api
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR || './' }}api/
          local-dir: ./api/
          dangerous-clean-slate: false
          timeout: 120000
          exclude: |
            **/config.local.php.example
            **/*.md
            **/*.sql
            **/.gitignore
